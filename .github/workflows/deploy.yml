name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & Type Check
        run: pnpm exec vp check

      - name: Test
        run: pnpm exec vp test --run

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm run build
        env:
          VITE_BASE_PATH: /kalendar/

      - name: E2E Test
        run: pnpm exec playwright test --ignore-snapshots --reporter=dot,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          VITE_BASE_PATH: /kalendar/
          PLAYWRIGHT_BASE_URL: http://localhost:5173/kalendar/

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: naka1998/naka1998.github.io
          publish_dir: ./dist
          destination_dir: kalendar
          publish_branch: master
