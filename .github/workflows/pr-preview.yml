name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Lint & Type Check
        if: github.event.action != 'closed'
        run: pnpm exec vp check

      - name: Test
        if: github.event.action != 'closed'
        run: pnpm exec vp test --run

      - name: Install Playwright Browsers
        if: github.event.action != 'closed'
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        if: github.event.action != 'closed'
        run: pnpm run build
        env:
          VITE_BASE_PATH: /kalendar-preview/pr-${{ github.event.number }}/

      - name: E2E Test
        if: github.event.action != 'closed'
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173/kalendar-preview/pr-${{ github.event.number }}/

      - name: Upload E2E Report
        if: always() && github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.number }}
          path: playwright-report/
          retention-days: 14

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          deploy-repository: naka1998/naka1998.github.io
          preview-branch: master
          umbrella-dir: kalendar-preview
          token: ${{ secrets.GH_PAT }}
          action: auto
